name: Atualizar informações da Ipiranga

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install requests beautifulsoup4

      - name: Atualizar informações da Ipiranga
        run: |
          python atualizar_ipiranga.py

      - name: Salvar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "Nenhuma informação nova encontrada."
          else
            git commit -m "Atualização automática das informações da Ipiranga"
            git push
          fi
