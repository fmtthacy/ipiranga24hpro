<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ipiranga 24h</title>

  <link
    rel="stylesheet"
    href="style.css?v=5"
  >
</head>


<body>

  <!-- ==================================================
       TELA INICIAL
       ================================================== -->

  <section
    class="login-screen"
    id="login-screen"
  >

    <div class="login-card">

      <div class="logo-area">

        <img
          class="logo-ipiranga"
          src="Screenshot_2026-09-14-13-41-10-437_com.openai.chatgpt-edit.jpg"
          alt="Ipiranga"
        >

      </div>


      <h1>Ipiranga 24h</h1>

      <p class="login-subtitulo">
        Informações e novidades da Ipiranga
      </p>


      <button
        class="botao-login"
        onclick="entrar()"
      >
        Entrar
      </button>


      <button
        class="botao-visitante"
        onclick="entrarComoVisitante()"
      >
        Continuar como visitante
      </button>


      <p class="texto-visitante">
        Você poderá acessar como visitante sem informar CPF.
      </p>

    </div>

  </section>



  <!-- ==================================================
       SITE PRINCIPAL
       ================================================== -->

  <div
    id="site"
    style="display: none;"
  >


    <!-- CABEÇALHO -->

    <header class="topbar">

      <div class="brand">

        <img
          src="Screenshot_2026-09-14-13-41-10-437_com.openai.chatgpt-edit.jpg"
          alt="Ipiranga"
        >

        <div>

          <h1>Ipiranga 24h</h1>

          <span>
            Informações e novidades
          </span>

        </div>

      </div>


      <button
        class="btn-sair"
        onclick="sair()"
      >
        Sair
      </button>

    </header>



    <!-- LINHA AMARELA -->

    <div class="linha-amarela"></div>



    <!-- CONTEÚDO -->

    <main class="conteudo">


      <!-- AVISO DO USUÁRIO -->

      <div class="aviso-visitante">

        👤 Você está navegando como visitante.

      </div>



      <!-- TÍTULO -->

      <section class="cabecalho-conteudo">

        <h2>
          Últimas informações
        </h2>

        <p>
          Confira as publicações e novidades.
        </p>

      </section>



      <!-- POSTS -->

      <section
        id="posts"
        class="posts"
      >

        <div class="carregando">

          Carregando informações...

        </div>

      </section>


    </main>

  </div>



  <!-- ==================================================
       SUPABASE
       ================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js?v=6"></script>


  <!-- ==================================================
       JAVASCRIPT DO SITE
       ================================================== -->

  <script
    src="script.js?v=5"
  ></script>


</body>

</html>
