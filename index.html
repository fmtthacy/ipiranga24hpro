<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ipiranga 24h</title>

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <!-- =========================
       TELA DE ENTRADA
  ========================== -->

  <section
    id="loginScreen"
    class="login-screen"
  >

    <div class="login-card">

      <div class="logo-area">

        <img
          src="Screenshot_2026-09-14-13-41-10-437_com.openai.chatgpt-edit.jpg"
          alt="Logo Ipiranga"
          class="logo-ipiranga"
        >

      </div>


      <h1>Ipiranga 24h</h1>

      <p>
        Informações, novidades e comunicados
        em um só lugar.
      </p>


      <button
        class="btn-primary"
        onclick="entrar()"
      >
        Entrar
      </button>


      <button
        class="btn-secondary"
        onclick="entrarComoVisitante()"
      >
        Continuar como visitante
      </button>


      <small>
        Você poderá acessar como visitante
        sem informar CPF.
      </small>

    </div>

  </section>



  <!-- =========================
       SITE
  ========================== -->

  <main
    id="site"
    style="display: none;"
  >

    <header class="topbar">

      <div class="brand">

        <img
          src="Screenshot_2026-09-14-13-41-10-437_com.openai.chatgpt-edit.jpg"
          alt="Ipiranga"
          class="logo-header"
        >


        <div>

          <h2>Ipiranga 24h</h2>

          <span>
            Informações e novidades da Ipiranga
          </span>

        </div>

      </div>


      <button
        class="btn-sair"
        onclick="sair()"
      >
        Sair
      </button>

    </header>


    <div class="linha-amarela"></div>


    <section class="aviso-visitante">

      👤 Você está navegando como visitante.

    </section>


    <section class="conteudo">

      <h1>
        Últimas informações
      </h1>


      <p class="subtitulo">
        Confira as publicações e novidades.
      </p>


      <div id="posts"></div>

    </section>

  </main>



  <!-- =========================
       ACESSO
  ========================== -->

  <script>

    function entrar() {

      alert(
        "A área de login ainda está em desenvolvimento. Você pode continuar como visitante."
      );

    }


    function entrarComoVisitante() {

      document.getElementById("loginScreen").style.display = "none";

      document.getElementById("site").style.display = "block";

      localStorage.setItem(
        "modoAcesso",
        "visitante"
      );

    }


    function sair() {

      document.getElementById("site").style.display = "none";

      document.getElementById("loginScreen").style.display = "flex";

      localStorage.removeItem(
        "modoAcesso"
      );

    }


    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const modo =
          localStorage.getItem(
            "modoAcesso"
          );


        if (modo === "visitante") {

          document.getElementById(
            "loginScreen"
          ).style.display = "none";


          document.getElementById(
            "site"
          ).style.display = "block";

        } else {

          document.getElementById(
            "loginScreen"
          ).style.display = "flex";


          document.getElementById(
            "site"
          ).style.display = "none";

        }

      }
    );

  </script>


  <!--
    ?v=3 força o navegador a usar
    a versão atualizada do JavaScript.
  -->

  <script src="script.js?v=3"></script>

</body>

</html>
